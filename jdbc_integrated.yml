# Databricks Asset Bundle for JDBC-integrated DLT-META Pipeline
# This uses DLT-META's native JDBC support (no separate bronze collector needed)

resources:
  jobs:
    jdbc_onboard_job:
      name: "JDBC Pipeline - Onboard"
      description: "온보딩: JDBC 메타데이터를 DLT-META에 등록"
      
      tasks:
        - task_key: onboard_bronze
          description: "Bronze 메타데이터 등록"
          notebook_task:
            notebook_path: ${workspace.root_path}/files/manual_onboard
            base_parameters:
              onboard_layer: "bronze"
              onboarding_file_path: "${workspace.root_path}/files/conf/onboarding_goods_option_dev.json"
              database: "${var.uc_catalog_name}.${var.bronze_schema}"
              bronze_dataflowspec_table: "bronze_dataflowspec"
              bronze_dataflowspec_path: "/Volumes/${var.uc_catalog_name}/${var.bronze_schema}/dlt_meta_dataflowspecs"
          job_cluster_key: main_cluster
        
        - task_key: onboard_silver
          description: "Silver 메타데이터 등록"
          depends_on:
            - task_key: onboard_bronze
          notebook_task:
            notebook_path: ${workspace.root_path}/files/manual_onboard
            base_parameters:
              onboard_layer: "silver"
              onboarding_file_path: "${workspace.root_path}/files/conf/onboarding_goods_option_dev.json"
              database: "${var.uc_catalog_name}.${var.silver_schema}"
              silver_dataflowspec_table: "silver_dataflowspec"
              silver_dataflowspec_path: "/Volumes/${var.uc_catalog_name}/${var.silver_schema}/dlt_meta_dataflowspecs"
              bronze_dataflowspec_table: "${var.uc_catalog_name}.${var.bronze_schema}.bronze_dataflowspec"
          job_cluster_key: main_cluster
      
      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 1
            spark_conf:
              "spark.databricks.python.defaultPythonPath": "${var.repos_path}"
      
      max_concurrent_runs: 1

    jdbc_pipeline_job:
      name: "JDBC Pipeline - Execute"
      description: "JDBC → Bronze → Silver 통합 파이프라인 (DLT-META Native JDBC)"
      
      tasks:
        # Bronze Pipeline: JDBC → Bronze Delta
        - task_key: bronze_pipeline
          description: "JDBC에서 Bronze Delta로 수집 (DLT-META)"
          pipeline_task:
            pipeline_id: ${resources.pipelines.jdbc_bronze_pipeline.id}
        
        # Silver Pipeline: Bronze → Silver
        - task_key: silver_pipeline
          description: "Bronze에서 Silver로 변환"
          depends_on:
            - task_key: bronze_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.jdbc_silver_pipeline.id}
      
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "Asia/Seoul"
        pause_status: "PAUSED"
      
      max_concurrent_runs: 1
      timeout_seconds: 7200

  pipelines:
    jdbc_bronze_pipeline:
      name: "JDBC Bronze Pipeline"
      
      libraries:
        - notebook:
            path: ${workspace.root_path}/files/dlt_meta_pipeline
      
      configuration:
        layer: "bronze"
        bronze.group: "sdppoc_item"
        bronze.dataflowspecTable: "${var.uc_catalog_name}.${var.bronze_schema}.bronze_dataflowspec"
        bronze.appendFlows: "False"
      
      target: "${var.uc_catalog_name}.${var.bronze_schema}"
      
      clusters:
        - label: "default"
          num_workers: 2
          spark_conf:
            "spark.databricks.delta.optimizeWrite.enabled": "true"
            "spark.databricks.delta.autoCompact.enabled": "true"
      
      development: true
      continuous: false
      channel: "CURRENT"
    
    jdbc_silver_pipeline:
      name: "JDBC Silver Pipeline"
      
      libraries:
        - notebook:
            path: ${workspace.root_path}/files/dlt_meta_pipeline
      
      configuration:
        layer: "silver"
        silver.group: "sdppoc_item"
        bronze.dataflowspecTable: "${var.uc_catalog_name}.${var.bronze_schema}.bronze_dataflowspec"
        silver.dataflowspecTable: "${var.uc_catalog_name}.${var.silver_schema}.silver_dataflowspec"
        silver.appendFlows: "True"
      
      target: "${var.uc_catalog_name}.${var.silver_schema}"
      
      clusters:
        - label: "default"
          num_workers: 2
          spark_conf:
            "spark.databricks.delta.optimizeWrite.enabled": "true"
            "spark.databricks.delta.autoCompact.enabled": "true"
      
      development: true
      continuous: false
      channel: "CURRENT"
